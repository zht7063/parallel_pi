<text x="1062" y="551" font-size="13" fill="#526278" font-weight="400">进入后关闭地图浮层</text>
<text x="247" y="804" font-size="13" fill="#526278" font-weight="400">左上角缩略图始终可点击：单击查看地图，双击返回全局地图。</text>
<text x="28" y="873" font-size="13" fill="#526278" font-weight="400">地图浮层不覆盖缩略图；关闭浮层返回原会话。预览节点与正在查看的会话是两个独立状态。</text>
