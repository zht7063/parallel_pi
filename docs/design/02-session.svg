<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img">
<title>专注会话</title><desc>02  专注会话：主区域用于工作，左上角缩略图保留全局入口。</desc>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3F5F8" stroke="#F3F5F8"/>
<text x="28" y="37" font-size="20" fill="#202D42" font-weight="700">parallel_pi  /  MVP v0.1</text>
<text x="28" y="64" font-size="13" fill="#526278" font-weight="400">02  专注会话：主区域用于工作，左上角缩略图保留全局入口。</text>
<text x="1220" y="38" font-size="13" fill="#526278" font-weight="400">静态线框 · 示例数据</text>
<rect x="24" y="88" width="1392" height="748" rx="8" fill="#FFFFFF" stroke="#CAD3DF"/>
<rect x="24" y="88" width="176" height="748" rx="8" fill="#EEF2F7" stroke="#CAD3DF"/>
<rect x="40" y="108" width="144" height="118" rx="8" fill="#FFFFFF" stroke="#315AA8"/>
<text x="51" y="130" font-size="13" fill="#315AA8" font-weight="700">项目地图</text>
<path d="M66 144 L66 207" stroke="#CAD3DF" stroke-width="2" fill="none" stroke-dasharray=""/>
<rect x="58" y="154" width="16" height="12" rx="8" fill="#EAF0FC" stroke="#CAD3DF"/>
<rect x="58" y="186" width="16" height="12" rx="8" fill="#EAF0FC" stroke="#CAD3DF"/>
<path d="M107 144 L107 207" stroke="#CAD3DF" stroke-width="2" fill="none" stroke-dasharray=""/>
<rect x="99" y="154" width="16" height="12" rx="8" fill="#EAF0FC" stroke="#CAD3DF"/>
<rect x="99" y="186" width="16" height="12" rx="8" fill="#EAF0FC" stroke="#CAD3DF"/>
<path d="M151 144 L151 207" stroke="#CAD3DF" stroke-width="2" fill="none" stroke-dasharray=""/>
<rect x="143" y="154" width="16" height="12" rx="8" fill="#EAF0FC" stroke="#CAD3DF"/>
<rect x="143" y="186" width="16" height="12" rx="8" fill="#EAF0FC" stroke="#CAD3DF"/>
<text x="42" y="247" font-size="11" fill="#526278" font-weight="400">单击查看 · 双击返回</text>
<rect x="40" y="262" width="144" height="34" rx="6" fill="#FFFFFF" stroke="#CAD3DF"/>
<text x="52" y="285" font-size="13" fill="#202D42" font-weight="400">返回全局地图</text>
<text x="42" y="551" font-size="12" fill="#526278" font-weight="400">运行 2  ·  待回答 1</text>
<rect x="40" y="572" width="144" height="34" rx="6" fill="#FFFFFF" stroke="#CAD3DF"/>
<text x="52" y="595" font-size="13" fill="#202D42" font-weight="400">＋ 添加项目</text>
<rect x="40" y="623" width="144" height="43" rx="8" fill="#FFFFFF" stroke="#CAD3DF"/>
<text x="51" y="642" font-size="13" fill="#202D42" font-weight="400">docs-site</text>
<text x="51" y="658" font-size="11" fill="#8B5C0C" font-weight="400">等待回答 1</text>
<rect x="40" y="674" width="144" height="50" rx="8" fill="#EAF0FC" stroke="#315AA8"/>
<text x="51" y="695" font-size="14" fill="#315AA8" font-weight="700">parallel_pi</text>
<text x="51" y="713" font-size="11" fill="#315AA8" font-weight="400">当前项目 · 运行 2</text>
<text x="42" y="747" font-size="11" fill="#526278" font-weight="400">新添加的项目靠下</text>
<rect x="40" y="779" width="144" height="34" rx="6" fill="#FFFFFF" stroke="#CAD3DF"/>
<text x="52" y="802" font-size="13" fill="#202D42" font-weight="400">pi 设置</text>
<text x="224" y="122" font-size="20" fill="#202D42" font-weight="700">parallel_pi / feature/queue / 实现分支队列</text>
<text x="224" y="146" font-size="12" fill="#526278" font-weight="400">~/workspace/parallel_pi</text>
<rect x="1000" y="105" width="187" height="34" rx="6" fill="#FFFFFF" stroke="#CAD3DF"/>
<text x="1012" y="128" font-size="13" fill="#202D42" font-weight="400">模型：项目默认</text>
<rect x="1197" y="105" width="88" height="34" rx="6" fill="#FFFFFF" stroke="#CAD3DF"/>
<text x="1209" y="128" font-size="13" fill="#202D42" font-weight="400">变更</text>
<rect x="1295" y="105" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#CAD3DF"/>
<text x="1307" y="128" font-size="13" fill="#202D42" font-weight="400">记忆</text>
<rect x="224" y="168" width="1170" height="42" rx="8" fill="#EAF0FC" stroke="#CAD3DF"/>
<text x="240" y="195" font-size="14" fill="#315AA8" font-weight="400">运行中  ·  feature/queue  ·  后续任务 1 项</text>
<rect x="1255" y="172" width="122" height="34" rx="6" fill="#FFFFFF" stroke="#CAD3DF"/>
<text x="1267" y="195" font-size="13" fill="#202D42" font-weight="400">停止任务</text>
<rect x="260" y="240" width="1090" height="86" rx="8" fill="#FFFFFF" stroke="#CAD3DF"/>
<text x="281" y="267" font-size="13" fill="#526278" font-weight="400">你</text>
<text x="281" y="297" font-size="17" fill="#202D42" font-weight="400">请实现同一 Git 分支串行、不同 Git 分支并行的队列。</text>
<rect x="260" y="350" width="1090" height="186" rx="8" fill="#FFFFFF" stroke="#CAD3DF"/>
<text x="281" y="379" font-size="13" fill="#315AA8" font-weight="700">pi</text>
<text x="281" y="415" font-size="17" fill="#202D42" font-weight="400">我会先检查分支与工作区的绑定，再实现执行队列。</text>
<rect x="281" y="439" width="1045" height="68" rx="8" fill="#F5F7FB" stroke="#CAD3DF"/>
<text x="298" y="466" font-size="14" fill="#202D42" font-weight="400">工具执行：读取调度模块</text>
<text x="298" y="491" font-size="13" fill="#526278" font-weight="400">正在检查取消后的进程收束与锁释放……</text>
<rect x="260" y="558" width="1090" height="43" rx="8" fill="#EAF0FC" stroke="#CAD3DF"/>
<text x="280" y="586" font-size="14" fill="#526278" font-weight="400">分支当前已有未提交修改；继续工作会使用这些修改。</text>
<rect x="260" y="636" width="1090" height="151" rx="8" fill="#FFFFFF" stroke="#CAD3DF"/>
<text x="282" y="669" font-size="16" fill="#526278" font-weight="400">继续输入下一项任务……</text>
<rect x="282" y="687" width="150" height="39" rx="8" fill="#F5F7FB" stroke="#CAD3DF"/>
<text x="294" y="712" font-size="12" fill="#526278" font-weight="400">图片预览 / 可移除</text>
<rect x="282" y="740" width="104" height="34" rx="6" fill="#FFFFFF" stroke="#CAD3DF"/>
<text x="294" y="763" font-size="13" fill="#202D42" font-weight="400">＋ 图片</text>
<text x="402" y="762" font-size="13" fill="#526278" font-weight="400">当前分支忙碌，发送后排队</text>
<rect x="1189" y="740" width="139" height="34" rx="6" fill="#315AA8" stroke="#315AA8"/>
<text x="1201" y="763" font-size="13" fill="#FFFFFF" font-weight="400">加入队列</text>
<text x="260" y="817" font-size="12" fill="#526278" font-weight="400">浏览其他项目不会停止当前任务；草稿按 session 保存。</text>
<text x="28" y="873" font-size="13" fill="#526278" font-weight="400">原 session 可持续多轮交流；从历史消息分叉创建新节点，新建接续会话按需读取文件记忆。</text>
</g></svg>